[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-release-task"
version = "0.1.0"
description = "Create a release task and its checklist subtasks in a Jira sprint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
jira-release-task = "jira_release_task.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_release_task"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
