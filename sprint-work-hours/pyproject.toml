[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-sprint-estimates"
version = "0.1.0"
description = "Report the total original estimate of work that transitioned to Done during a Jira sprint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
jira-sprint-estimates = "jira_sprint_estimates.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_sprint_estimates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
